# monitor-layout configuration
# Location: ~/.config/monitor-layout/config
#
# Run `monitor-layout-config` (Super+Alt+P) to configure interactively,
# or edit this file directly. Changes take effect on the next layout switch.

# ── Workspaces ─────────────────────────────────────────────────────────────────

# Total number of workspaces distributed across all active monitors.
TOTAL_WORKSPACES=10

# Workspace distribution across monitors (in priority order).
# Leave empty for automatic even distribution — remainder goes to first monitors:
#
#   Auto, 2 monitors, 10 WS  →  1-5 on M1,  6-10 on M2
#   Auto, 3 monitors, 10 WS  →  1-4 on M1,  5-7 on M2,  8-10 on M3
#   Auto, 4 monitors, 10 WS  →  1-3 on M1,  4-6 on M2,  7-8 on M3,  9-10 on M4
#
# Custom — space-separated ranges (one per monitor, in priority order):
#   WORKSPACE_DISTRIBUTION="1-4 5-7 8-10"
#
# Custom — space-separated counts:
#   WORKSPACE_DISTRIBUTION="4 3 3"
#
WORKSPACE_DISTRIBUTION=""

# ── Monitor priority ───────────────────────────────────────────────────────────

# Monitor names, in order of priority (primary → secondary → tertiary).
# Leave empty to use the order returned by `hyprctl monitors all`.
#
# Find your monitor names:
#   hyprctl monitors all -j | jq -r '.[].name'
#
PRIMARY_MONITOR=""
SECONDARY_MONITOR=""
TERTIARY_MONITOR=""

# ── Extend layout ──────────────────────────────────────────────────────────────

# Arrangement of monitors in extend mode.
#   horizontal  — side by side (← →)   [default]
#   vertical    — stacked   (↑ ↓)
EXTEND_DIRECTION=horizontal

# ── Menu ───────────────────────────────────────────────────────────────────────

# Command used for the interactive layout picker (Super+P).
# Must accept items on stdin and print the selected item to stdout.
MENU_CMD="walker --dmenu --placeholder 'Monitor layout:'"
